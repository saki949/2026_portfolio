      function updatePageNumbers() {
        const sheets = Array.from(document.querySelectorAll(".sheet:not(.hide-sheet)"));
        const total = sheets.length;
        const totalStr = String(total).padStart(2, "0");
        sheets.forEach((sheet, idx) => {
          const currentStr = String(idx + 1).padStart(2, "0");
          const shRight = sheet.querySelector(".sh-right");
          if (shRight) {
            shRight.textContent = `PAGE ${currentStr} / ${totalStr}`;
          }
          const bchRight = sheet.querySelector(".bch-right");
          if (bchRight) {
            bchRight.textContent = `PAGE ${currentStr} / ${totalStr}`;

            sfBadge.textContent = `${label} ｜ P. ${currentStr}`;
          }
        });
      }
